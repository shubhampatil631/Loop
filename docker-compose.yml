version: "3.8"
services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/loop
    depends_on: [mongo]
    volumes:
      - ./backend/chroma_data:/app/chroma_data

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    depends_on: [backend]

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
